chainlit: 2.4.1

project:
  host: 0.0.0.0
  port: ${PORT}
  public: true

ui:
  name: "SocialMediaPoster"
  description: "A simple social media posting tool with GitHub authentication built with Python, UV, and Chainlit."

default_expand_messages: true

auth:
  required: true
  providers:
    - github

oauth_providers:
  github:
    client_id: ${OAUTH_GITHUB_CLIENT_ID}
    client_secret: ${OAUTH_GITHUB_CLIENT_SECRET}
